<!doctype html>
<html lang="en">

<head>
	<title>I'm Not A Robot</title>
	<script>
		(function () {
			const theme = localStorage.getItem('pref_theme');
			if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
		})();
	</script>
	<link rel="icon" type="image/png" href="images/favicon.png">
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="css/reset.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/menu.css">
	<link rel="stylesheet" href="css/game.css">
	<link rel="stylesheet" href="css/cell.css">
	<link rel="stylesheet" href="css/fonts.css">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="description" content="A memory match game featuring trending images from the web for the tiles!">
	<meta property="og:title" content="I'm Not A Robot">
	<meta property="og:description" content="A memory match game featuring trending images from the web for the tiles!">
	<meta property="og:image" content="https://clayrobot.net/games/recaptcha/images/opengraph.webp">
	<meta property="og:url" content="https://clayrobot.net/games/recaptcha">
	<meta property="og:type" content="website">
	<style>
		html,
		body {
			height: 100svh;
			width: 100svw;
			overflow: hidden;
			user-select: none;
		}
	</style>
</head>

<body>
	<div id="background">
		<video autoplay muted loop playsinline poster="images/grid.png">
			<source src="images/grid24.webm" type="video/webm">
		</video>
	</div>

	<div id="splash-container" class="center">
		<div id="splash-text"></div>
	</div>

	<div id="win-splash-a" class="center"></div>
	<div id="win-splash-b" class="center"></div>

	<!-- 100% win screen -->
	<div id="win-screen">
		<div id="win-screen-card">
			<div id="win-screen-headline" class="candy-text"></div>
			<div id="win-screen-stars">
				<span class="win-star">★</span>
				<span class="win-star">★</span>
				<span class="win-star">★</span>
			</div>
			<div id="win-screen-stats">
				<div class="win-stat win-stat--trends">
					<span class="win-stat-value" id="win-stat-trends">0</span>
					<span class="win-stat-label">Trends</span>
				</div>
				<div class="win-stat win-stat--levels">
					<span class="win-stat-value" id="win-stat-levels">0</span>
					<span class="win-stat-label">Rounds</span>
				</div>
				<div class="win-stat win-stat--perfect">
					<span class="win-stat-value" id="win-stat-perfect">0</span>
					<span class="win-stat-label">Flawless</span>
				</div>
			</div>
			<div id="win-screen-prompt">Tap to Continue</div>
		</div>
	</div>

	<div id="menu-container"></div>

	<div style="display: none;">
		<img src="images/faces/1.png">
		<img src="images/faces/2.png">
		<img src="images/faces/3a.png">
		<img src="images/faces/scarf.png">
		<img src="images/faces/4a.gif">
		<img src="images/faces/4b.gif">
		<img src="images/faces/5a.gif">
		<img src="images/faces/5b.gif">
		<img src="images/faces/7a.png">
		<img src="images/faces/7b.png">
		<img src="images/faces/break.gif">
		<img src="images/faces/special1.png">
		<img src="images/faces/special2.png">
		<img src="images/faces/special3.gif">
		<img src="images/faces/special4.gif">
		<img src="images/faces/trophy_resized.gif">
	</div>
	<script type="module" src="js/main.js"></script>
</body>

</html>
